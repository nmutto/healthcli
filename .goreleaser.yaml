# GoReleaser v2 config. Local test (publishes nothing):
#   goreleaser release --snapshot --clean --skip=publish
version: 2

project_name: healthcli

before:
  hooks:
    - sh -c 'rm -rf completions && mkdir completions'
    - sh -c 'go run ./cmd/healthcli completion bash > completions/healthcli.bash'
    - sh -c 'go run ./cmd/healthcli completion zsh > completions/_healthcli'
    - sh -c 'go run ./cmd/healthcli completion fish > completions/healthcli.fish'

builds:
  - id: healthcli
    main: ./cmd/healthcli
    binary: healthcli
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/nmutto/healthcli/internal/cli.Version={{.Version}}
      - -X github.com/nmutto/healthcli/internal/cli.Commit={{.Commit}}
      - -X github.com/nmutto/healthcli/internal/cli.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - src: completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md (--release-notes), not the git log.
changelog:
  disable: true

# A GitHub release is only created by a real `goreleaser release` run (no
# --skip=publish) on a tag, with GITHUB_TOKEN set. Releases start as drafts.
release:
  github:
    owner: nmutto
    name: healthcli
  draft: true
  prerelease: auto
